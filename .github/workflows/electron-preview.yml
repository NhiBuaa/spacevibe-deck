name: Electron Preview

# A signed, notarized build of a commit that is not released yet. Run it on the commit a
# release will cut (`release:cut --expect-sha <sha>`) or on a branch that needs the real
# packaging path before it merges.
#
# It publishes NOTHING: no draft, no release, no tag, no update manifest. A prerelease would
# land in `releases.atom`, and builds through 1.2.0 take that feed's newest entry and then
# fail their update check against it (DECK-103). The output is a 7-day Actions artifact.
#
# Release switches stay at their file values here, because a packaged app is not a
# development run. A branch shows a gated feature only if it carries the activation commit.
#
# The mac and windows steps mirror `electron-release.yml` on purpose, minus the draft and the
# publishing flag; change them together. Runbook: docs/operations/release.md.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of this repository, or a commit SHA reachable from one
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    # The signing secrets run beside the code at `ref`, so only the workflow file on main may
    # start this, and `ref` must be a commit already in this repository's own branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout the requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Refuse a commit that is on no branch of this repository
        id: target
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # A fork's commit can be fetched by SHA through the repository network, so
          # reachability from an origin branch is the check, not the checkout succeeding.
          if [[ -z "$(git branch -r --contains "$sha")" ]]; then
            echo "Commit $sha is on no branch of this repository"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Preview of $sha" >> "$GITHUB_STEP_SUMMARY"

  mac:
    needs: resolve
    runs-on: macos-latest
    steps:
      - name: Checkout the resolved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import the Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/deck-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$certificate" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported"
            exit 1
          fi
          rm -f "$certificate"

      - name: Build, sign and notarize without publishing
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          node scripts/verify-electron-release-signing.mjs
          npm run build
          npm run electron:build
          npx electron-builder --config electron-builder.release.yml \
            --mac --arm64 --publish never

      - name: Verify the app is signed, notarized and stapled
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist-electron-release/mac-arm64/*.app)
          if [[ ${#apps[@]} -ne 1 ]]; then
            echo "Expected exactly one app bundle"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign --verify --verbose=2 \
            "${apps[0]}/Contents/Resources/app.asar.unpacked/node_modules/node-pty/build/Release/spawn-helper"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          codesign --test-requirement="=notarized" --verify --verbose=2 "${apps[0]}"

      - name: Keep the macOS installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-preview-macos
          path: |
            dist-electron-release/*.dmg
            dist-electron-release/*.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - name: Checkout the resolved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the unsigned installer without publishing
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run electron:build
          npx electron-builder --config electron-builder.release.yml --win --x64 --publish never

      - name: Keep the Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-preview-windows
          path: dist-electron-release/*-setup.exe
          if-no-files-found: error
          retention-days: 7
